<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="weather.css">
</head>

<body>


    <div class="container">
        <!-- Search -->
        <div id="search-bar">
            <input type="text" id="city-input" spellcheck="true"  placeholder="Enter the city name">
            <button id="search-btn">Search</button>
        </div>

        <!-- ERROR MESSAGE -->
        <p id="error-msg"></p>

            <!-- Weather Result -->
        <div id ="weather-result"></div> 

    </div>








    <script src="weather.js"></script>
</body>

</html>
